spring.application.name=AddressBook
# === DATABASE CONFIGURATION ===

# MySQL DB URL: jdbc:mysql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:mysql://localhost:3306/addressbook

# DB username and password
spring.datasource.username=root
spring.datasource.password=R@gul@2004

# === JPA & HIBERNATE SETTINGS ===

# Automatically create/update tables based on Entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL statements in the console
spring.jpa.show-sql=true

# Hibernate dialect for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect